plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral() // JUnit only — Minecraft/Fabric artifacts still resolve via Loom's own repos.
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
	maven {
		name = "Henkelmax"
		url = "https://maven.maxhenkel.de/repository/public"
		content { includeGroup "de.maxhenkel.voicechat" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"phantasmon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cobblemon (CAD Phase 7: reuse its Pokémon models/animations/renderer for Ghost entities).
	// Version pinned by Modrinth VERSION ID, not the plain "1.8.1" string: Cobblemon publishes
	// separate Fabric/NeoForge builds that both use "1.8.1" as their version_number, which collide
	// on Modrinth's Maven proxy — the version id is what actually resolves the Fabric jar
	// unambiguously (verified 2026-09-26 against the live Modrinth API/Maven).
	modImplementation "maven.modrinth:cobblemon:${project.cobblemon_version}"
	// Cobblemon's own API surface is Kotlin (e.g. AbilityPool implements Iterable<T> via a
	// Kotlin marker interface); fabric-language-kotlin supplies kotlin-stdlib at runtime
	// (it's a Cobblemon dependency), but javac still needs the class files on the compile
	// classpath to resolve that interface hierarchy — compileOnly avoids bundling a second copy.
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

	// Simple Voice Chat: optional (D-36) — only its plugin API is compiled against, never bundled. The oldest 2.5 API, so
	// any 2.5.x of the modpack (1.21.1) runs it; without the mod, its entrypoint is never loaded and the hub has no voice.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

	// Mod Menu: optional — only its API is compiled against, for the "Configure" button (music screen).
	modCompileOnly "maven.modrinth:modmenu:11.0.3"

	// JUnit — pure-logic classes only (e.g. VersionCompatibility); rendering/world
	// interaction stays manual QA (see PHANTASMON_CLIENT conventions).
	testImplementation platform('org.junit:junit-bom:5.11.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

// The test source set only sees `main` by default; pure-logic classes like
// VersionCompatibility live in `client` (this mod is client-only), so wire it in.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
